<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}} · lyrics</title>
<style>
:root{--ink:#1c1a19;--dim:#8a837e;--paper:#faf7f2;}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
font:17px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
-webkit-text-size-adjust:100%;}
main{max-width:620px;margin:0 auto;padding:56px 24px 72px}
header{margin-bottom:44px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px;letter-spacing:-.01em;font-weight:650}
.kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0}
section{margin:0 0 30px}
h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
font-weight:600;margin:0 0 8px}
p{margin:0}
footer{margin-top:56px;padding-top:20px;border-top:1px solid #e6e0d8;font-size:14px;color:var(--dim)}
footer a{color:var(--dim)}
@media print{body{background:#fff}main{padding:0}footer{border:0}}
</style>
</head>
<body>
<main>
<header>
  <p class="kicker">The Song Desk</p>
  <h1>{{TITLE}}</h1>
  <p class="kicker" style="letter-spacing:.04em;text-transform:none;font-size:14px">lyrics sheet</p>
</header>
{{SECTIONS}}
<footer>Written to your brief. Questions or a line to change: just reply in our chat.<br>
&mdash; Xicheng Lee, <a href="https://xichenglee.github.io/xicheng-hub/shop-song.html">The Song Desk</a></footer>
</main>
</body>
</html>
